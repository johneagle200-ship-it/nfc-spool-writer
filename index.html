<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSpool Writer для U1 Extended v1.4</title>

  <!-- PWA и метатеги для мобилок -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 12px 16px;
      max-width: 400px;
      margin: 0 auto;
    }
    h2 {
      font-size: 18px;
      margin: 0 0 12px 0;
      text-align: center;
    }
    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 13px; }
    select, input {
      width: 100%;
      padding: 9px 12px;
      box-sizing: border-box;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 15px;
    }
    input[type="color"] { padding: 3px; height: 38px; }
    .color-row {
      display: flex;
      gap: 10px;
    }
    .color-row > div {
      flex: 1;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    #writeBtn { background: #4caf50; }
    #writeBtn:active { background: #388e3c; }
    #readBtn { background: #2196f3; }
    #readBtn:active { background: #1976d2; }
    #cancelBtn {
      width: 100%;
      background: #f44336;
      margin-top: 8px;
      display: none;
    }
    #cancelBtn:active { background: #d32f2f; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #log { margin-top: 12px; font-size: 12px; color: #aaa; text-align: center; word-break: break-all; }
    .success { color: #4caf50 !important; }
    .error { color: #f44336 !important; }
  </style>
</head>
<body>

  <h2>OpenSpool Writer (NTAG216) v1.4</h2>

  <div class="form-group">
    <label>Бренд:</label>
    <input type="text" id="brand" value="Generic" placeholder="eSUN, Kingroon...">
  </div>

  <div class="form-group">
    <label>Тип материала:</label>
    <select id="material">
      <option value="PLA">PLA</option>
      <option value="PETG">PETG</option>
      <option value="PETG-CF">PETG-CF</option>
      <option value="PETG-GF">PETG-GF</option>
      <option value="ABS">ABS</option>
      <option value="ASA">ASA</option>
      <option value="SBS">SBS</option>
      <option value="TPU">TPU</option>
    </select>
  </div>

  <div class="form-group">
    <label>Подтип (необязательно):</label>
    <input type="text" id="subtype" placeholder="Plus, Silk, Matte, Glass...">
  </div>

  <div class="color-row">
    <div class="form-group">
      <label>Цвет:</label>
      <input type="color" id="color" value="#FF69B4">
    </div>
    <div class="form-group">
      <label>Прозрачность:</label>
      <select id="alpha">
        <option value="FF" selected>100% (Глухой)</option>
        <option value="C0">75%</option>
        <option value="80">50% (Полупрозрачный)</option>
        <option value="40">25%</option>
        <option value="00">0% (Прозрачный)</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>Формат цвета (кодировка):</label>
    <select id="color_format">
      <option value="GRB" selected>GRB (Фикс для Snapmaker U1)</option>
      <option value="RGB">RGB (Стандарт)</option>
      <option value="BGR">BGR</option>
    </select>
  </div>

  <div class="form-group">
    <label>Вес катушки (г):</label>
    <input type="number" id="weight" value="1000" step="50">
  </div>

  <div class="form-group">
    <label>Мин. T сопла (°C):</label>
    <input type="number" id="min_temp" step="1">
  </div>

  <div class="form-group">
    <label>Макс. T сопла (°C):</label>
    <input type="number" id="max_temp" step="1">
  </div>

  <div class="btn-group">
    <button id="writeBtn">Записать</button>
    <button id="readBtn">Считать</button>
  </div>
  <button id="cancelBtn">Отменить ожидание</button>

  <div id="log">Выберите действие и приложите метку</div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const defaultTemps = {
      "PLA":     { min: 190, max: 220 },
      "PETG":    { min: 230, max: 250 },
      "PETG-CF": { min: 240, max: 260 },
      "PETG-GF": { min: 240, max: 260 },
      "ABS":     { min: 250, max: 270 },
      "ASA":     { min: 250, max: 270 },
      "SBS":     { min: 220, max: 240 },
      "TPU":     { min: 210, max: 230 }
    };

    const matSelect = document.getElementById('material');
    const minTempInput = document.getElementById('min_temp');
    const maxTempInput = document.getElementById('max_temp');
    const logDiv = document.getElementById('log');
    const writeBtn = document.getElementById('writeBtn');
    const readBtn = document.getElementById('readBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    let abortController = null;

    matSelect.addEventListener('change', (e) => {
      const mat = e.target.value;
      if (defaultTemps[mat]) {
        minTempInput.value = defaultTemps[mat].min;
        maxTempInput.value = defaultTemps[mat].max;
      }
    });
    matSelect.dispatchEvent(new Event('change'));

    // Кодирование цвета под U1/Стандарт
    function formatColorHex(hex, format) {
      const r = hex.substring(0, 2);
      const g = hex.substring(2, 4);
      const b = hex.substring(4, 6);

      if (format === 'GRB') return g + r + b;
      if (format === 'BGR') return b + g + r;
      return r + g + b;
    }

    // Декодирование обратно в стандартный RGB для <input type="color">
    function parseColorToRGBHex(storedHex, format) {
      if (!storedHex || storedHex.length < 6) return "FF69B4";
      const c1 = storedHex.substring(0, 2);
      const c2 = storedHex.substring(2, 4);
      const c3 = storedHex.substring(4, 6);

      let r = c1, g = c2, b = c3;
      if (format === 'GRB') { g = c1; r = c2; b = c3; }
      else if (format === 'BGR') { b = c1; g = c2; r = c3; }

      return `#${r}${g}${b}`;
    }

    function setBusyState(isBusy) {
      writeBtn.disabled = isBusy;
      readBtn.disabled = isBusy;
      cancelBtn.style.display = isBusy ? 'block' : 'none';
    }

    function cancelCurrentOperation() {
      if (abortController) {
        abortController.abort();
        abortController = null;
      }
      setBusyState(false);
      logDiv.innerHTML = "Операция отменена.";
    }

    cancelBtn.addEventListener('click', cancelCurrentOperation);

    // --- ЗАПИСЬ ---
    writeBtn.addEventListener('click', async () => {
      if (!("NDEFReader" in window)) {
        logDiv.innerHTML = "<span class='error'>Web NFC не поддерживается! Откройте в Chrome на Android.</span>";
        return;
      }

      const minVal = parseInt(minTempInput.value) || 0;
      const maxVal = parseInt(maxTempInput.value) || 0;
      if (maxVal < minVal) {
        logDiv.innerHTML = "<span class='error'>❌ Макс. температура должна быть больше или равна мин.!</span>";
        return;
      }

      const rawColor = document.getElementById('color').value.replace('#', '');
      const colorFormat = document.getElementById('color_format').value;
      const processedColor = formatColorHex(rawColor, colorFormat).toUpperCase();

      const payloadObj = {
        protocol: "openspool",
        brand: document.getElementById('brand').value || "Generic",
        type: matSelect.value,
        subtype: document.getElementById('subtype').value.trim(),
        color_hex: processedColor,
        alpha: document.getElementById('alpha').value,
        weight: parseInt(document.getElementById('weight').value) || 1000,
        min_temp: minVal,
        max_temp: maxVal
      };

      const payloadString = JSON.stringify(payloadObj);
      const encodedData = new TextEncoder().encode(payloadString);

      abortController = new AbortController();
      setBusyState(true);
      logDiv.innerHTML = "Ожидание метки... Приложите NTAG216 к телефону.";

      try {
        const ndef = new NDEFReader();
        await ndef.write({
          records: [{
            recordType: "mime",
            mediaType: "application/json",
            data: encodedData
          }]
        }, { signal: abortController.signal });

        logDiv.innerHTML = `<span class='success'>✅ Успешно записано!</span><br><br><code>${payloadString}</code>`;
      } catch (error) {
        if (error.name !== 'AbortError') {
          logDiv.innerHTML = `<span class='error'>❌ Ошибка записи: ${error.message}</span>`;
        }
      } finally {
        setBusyState(false);
      }
    });

    // --- ЧТЕНИЕ ---
    readBtn.addEventListener('click', async () => {
      if (!("NDEFReader" in window)) {
        logDiv.innerHTML = "<span class='error'>Web NFC не поддерживается! Откройте в Chrome на Android.</span>";
        return;
      }

      abortController = new AbortController();
      setBusyState(true);
      logDiv.innerHTML = "Ожидание метки... Приложите NTAG216 для чтения.";

      try {
        const ndef = new NDEFReader();
        await ndef.scan({ signal: abortController.signal });

        ndef.addEventListener("reading", ({ message }) => {
          let parsed = false;
          for (const record of message.records) {
            if (record.recordType === "mime" && record.mediaType === "application/json") {
              try {
                const jsonText = new TextDecoder().decode(record.data);
                const data = JSON.parse(jsonText);

                // Заполнение полей формы данными из чипа
                if (data.brand) document.getElementById('brand').value = data.brand;
                if (data.type) {
                  matSelect.value = data.type;
                  matSelect.dispatchEvent(new Event('change'));
                }
                if (data.subtype !== undefined) document.getElementById('subtype').value = data.subtype;
                if (data.weight) document.getElementById('weight').value = data.weight;
                if (data.min_temp !== undefined) minTempInput.value = data.min_temp;
                if (data.max_temp !== undefined) maxTempInput.value = data.max_temp;
                if (data.alpha) document.getElementById('alpha').value = data.alpha;

                const currentFormat = document.getElementById('color_format').value;
                if (data.color_hex) {
                  document.getElementById('color').value = parseColorToRGBHex(data.color_hex, currentFormat);
                }

                logDiv.innerHTML = `<span class='success'>✅ Считано с чипа:</span><br><br><code>${jsonText}</code>`;
                parsed = true;
                break;
              } catch (e) {
                logDiv.innerHTML = "<span class='error'>❌ Ошибка разбора JSON на метке</span>";
              }
            }
          }

          if (!parsed) {
            logDiv.innerHTML = "<span class='error'>❌ OpenSpool JSON не найден на этой метке</span>";
          }
          setBusyState(false);
        }, { once: true });

      } catch (error) {
        if (error.name !== 'AbortError') {
          logDiv.innerHTML = `<span class='error'>❌ Ошибка сканирования: ${error.message}</span>`;
        }
        setBusyState(false);
      }
    });
  </script>

</body>
</html>
