<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSpool Writer для U1 Extended v1.0</title>

  <!-- PWA и метатеги для мобилок -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
    body {
      font-family: system-ui, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      padding: 12px 16px;
      max-width: 400px;
      margin: 0 auto;
    }
    h2 {
      font-size: 18px;
      margin: 0 0 12px 0;
      text-align: center;
    }
    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 13px; }
    select, input {
      width: 100%;
      padding: 9px 12px;
      box-sizing: border-box;
      background: #1e1e1e;
      border: 1px solid #333;
      color: #fff;
      border-radius: 6px;
      font-size: 15px;
    }
    input[type="color"] { padding: 3px; height: 38px; }
    button {
      width: 100%;
      padding: 12px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }
    button:active { background: #388e3c; }
    #log { margin-top: 12px; font-size: 12px; color: #aaa; text-align: center; word-break: break-all; }
    .success { color: #4caf50 !important; }
    .error { color: #f44336 !important; }
  </style>
</head>
<body>

  <h2>OpenSpool Writer для U1 Extended v1.0</h2>

  <div class="form-group">
    <label>Бренд:</label>
    <input type="text" id="brand" value="Generic">
  </div>

  <div class="form-group">
    <label>Тип материала:</label>
    <select id="material">
      <option value="PLA">PLA</option>
      <option value="PETG">PETG</option>
      <option value="PETG-CF">PETG-CF</option>
      <option value="PETG-GF">PETG-GF</option>
      <option value="ABS">ABS</option>
      <option value="ASA">ASA</option>
      <option value="TPU">TPU</option>
    </select>
  </div>

  <div class="form-group">
    <label>Цвет катушки:</label>
    <input type="color" id="color" value="#00FF00">
  </div>

  <div class="form-group">
    <label>Мин. T сопла (°C):</label>
    <input type="number" id="min_temp" step="1">
  </div>

  <div class="form-group">
    <label>Макс. T сопла (°C):</label>
    <input type="number" id="max_temp" step="1">
  </div>

  <div class="form-group">
    <label>Т. стола (°C):</label>
    <input type="number" id="bed_temp" step="1">
  </div>

  <div class="form-group">
    <label>Т. 1-го слоя (°C):</label>
    <input type="number" id="first_layer_temp" step="1">
  </div>

  <div class="form-group">
    <label>Т. остальных слоев (°C):</label>
    <input type="number" id="other_layer_temp" step="1">
  </div>

  <div class="form-group">
    <label>Т. сушки (°C):</label>
    <input type="number" id="drying_temp" step="1">
  </div>

  <button id="writeBtn">Записать на чип (NTAG215/216)</button>
  <div id="log">Приложите чип после нажатия</div>

  <script>
    // Регистрация Service Worker для квалификации PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const defaultTemps = {
      "PLA":     { min: 190, max: 220, bed: 55, first: 200, other: 200, drying: 45 },
      "PETG":    { min: 230, max: 250, bed: 75, first: 240, other: 240, drying: 55 },
      "PETG-CF": { min: 240, max: 260, bed: 80, first: 250, other: 250, drying: 55 },
      "PETG-GF": { min: 240, max: 260, bed: 80, first: 250, other: 250, drying: 55 },
      "ABS":     { min: 250, max: 270, bed: 95, first: 260, other: 260, drying: 65 },
      "ASA":     { min: 250, max: 270, bed: 95, first: 260, other: 260, drying: 65 },
      "TPU":     { min: 210, max: 230, bed: 45, first: 220, other: 220, drying: 45 }
    };

    const matSelect = document.getElementById('material');
    const minTempInput = document.getElementById('min_temp');
    const maxTempInput = document.getElementById('max_temp');
    const bedTempInput = document.getElementById('bed_temp');
    const firstLayerInput = document.getElementById('first_layer_temp');
    const otherLayerInput = document.getElementById('other_layer_temp');
    const dryingTempInput = document.getElementById('drying_temp');
    const logDiv = document.getElementById('log');

    matSelect.addEventListener('change', (e) => {
      const mat = e.target.value;
      if(defaultTemps[mat]) {
        minTempInput.value = defaultTemps[mat].min;
        maxTempInput.value = defaultTemps[mat].max;
        bedTempInput.value = defaultTemps[mat].bed;
        firstLayerInput.value = defaultTemps[mat].first;
        otherLayerInput.value = defaultTemps[mat].other;
        dryingTempInput.value = defaultTemps[mat].drying;
      }
    });

    matSelect.dispatchEvent(new Event('change'));

    document.getElementById('writeBtn').addEventListener('click', async () => {
      if (!("NDEFReader" in window)) {
        logDiv.innerHTML = "<span class='error'>Web NFC не поддерживается! Откройте в Chrome на Android.</span>";
        return;
      }

      const rawColor = document.getElementById('color').value.replace('#', '');

      const payloadObj = {
        protocol: "openspool",
        version: "1.0",
        brand: document.getElementById('brand').value,
        type: matSelect.value,
        color_hex: rawColor,
        hotend_min_temp: parseInt(minTempInput.value),
        hotend_max_temp: parseInt(maxTempInput.value),
        bed_temp: parseInt(bedTempInput.value),
        first_layer_temp: parseInt(firstLayerInput.value),
        other_layer_temp: parseInt(otherLayerInput.value),
        drying_temp: parseInt(dryingTempInput.value)
      };

      const payloadString = JSON.stringify(payloadObj);
      const encoder = new TextEncoder();
      const encodedData = encoder.encode(payloadString);

      logDiv.innerHTML = "Ожидание метки... Приложите чип к телефону.";

      try {
        const ndef = new NDEFReader();
        await ndef.write({
          records: [{
            recordType: "mime",
            mediaType: "application/json",
            data: encodedData
          }]
        });
        logDiv.innerHTML = `<span class='success'>✅ Успешно записано!</span><br><br>${payloadString}`;
      } catch (error) {
        logDiv.innerHTML = `<span class='error'>❌ Ошибка: ${error.message}</span>`;
      }
    });
  </script>

</body>
</html>
